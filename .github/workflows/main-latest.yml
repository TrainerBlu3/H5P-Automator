name: Main — rolling update channel

# Every push to `main` rebuilds all three platforms and republishes them
# under a moving "latest" tag/release (prerelease, always published — not
# draft, since the in-app updater (gui/updater.py) polls it automatically).
# This is a separate channel from tagged v*.*.* releases (release.yml),
# which stay drafts for manual review before going out.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  move-latest-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Force-move "latest" tag to this commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push origin latest --force

  build:
    needs: move-latest-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: H5PAutomator-Windows
          - os: macos-latest
            artifact_name: H5PAutomator-macOS
          - os: ubuntu-latest
            artifact_name: H5PAutomator-Linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyQt6 runtime libs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 libegl1 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libdbus-1-3 libfontconfig1 libfreetype6

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Write build info
        shell: bash
        run: echo "BUILD_SHA = \"${{ github.sha }}\"" > gui/_build_info.py

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: >
          pyinstaller --noconfirm --clean --windowed --onefile
          --name H5PAutomator
          --paths src
          --collect-all playwright
          gui_h5p.py

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: >
          pyinstaller --noconfirm --clean --windowed --onefile
          --name H5PAutomator
          --paths src
          --collect-all playwright
          gui_h5p.py

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: >
          pyinstaller --noconfirm --clean --onefile
          --name H5PAutomator
          --paths src
          --collect-all playwright
          gui_h5p.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path dist/H5PAutomator.exe -DestinationPath dist/${{ matrix.artifact_name }}.zip
        shell: pwsh

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r ${{ matrix.artifact_name }}.zip H5PAutomator.app

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist
          chmod +x H5PAutomator
          zip ${{ matrix.artifact_name }}.zip H5PAutomator

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}.zip
          if-no-files-found: error

      - name: Publish rolling "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest (main) — rolling build"
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          draft: false
          files: dist/${{ matrix.artifact_name }}.zip
